<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Register - Royal Matka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 50px;">
    <h2 class="royal-text" style="text-align: center; margin-bottom: 20px;">Create Account</h2>
    <div class="card">
      <form onsubmit="registerUser(event)">
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="regUser" class="input-field" required>
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="regEmail" class="input-field" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="regPass" class="input-field" required>
        </div>
        <button type="submit" class="btn btn-gold btn-full">Register</button>
      </form>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
